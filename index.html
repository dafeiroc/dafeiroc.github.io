<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dafeiroc</title>
  <meta name="description" content="dafeiroc 的个人主页">
  <style>
    :root {
      --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --line: #292524; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 72px 20px 48px; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; border: 1px solid var(--line); }
    h1 { font-size: 2rem; margin: 20px 0 4px; }
    .tagline { color: var(--muted); margin: 0 0 32px; }
    h2 { font-size: 1.1rem; margin: 36px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    ul { padding-left: 1.2em; margin: 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { display: flex; flex-wrap: wrap; gap: 16px; list-style: none; padding: 0; }
    footer { margin-top: 56px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="https://github.com/dafeiroc.png" alt="dafeiroc 的头像">
    <h1>dafeiroc</h1>
    <p class="tagline">软件开发者 · 在这里写一句你的简介</p>

    <h2>关于我</h2>
    <p>你好！我是 dafeiroc。这里可以写几句关于你自己的介绍：你在做什么、关注哪些技术、有什么兴趣爱好。</p>

    <h2>技能 / 关注领域</h2>
    <ul>
      <li>领域一（例如：Web 开发）</li>
      <li>领域二（例如：数据分析）</li>
      <li>领域三（例如：云计算）</li>
    </ul>

    <h2>联系方式</h2>
    <ul class="links">
      <li><a href="https://github.com/dafeiroc">GitHub</a></li>
      <!-- <li><a href="mailto:you@example.com">Email</a></li> -->
    </ul>

    <footer>© <span id="y"></span> dafeiroc</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
